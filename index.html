<title>심 게임</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap');

  :root {
    --bg: #eef2fb;
    --bg-grid: #d7e1f6;
    --surface: #ffffff;
    --surface-2: #f4f7fe;
    --ink: #1b2140;
    --muted: #666f91;
    --heading: #1e2761;
    --accent: #f2b705;
    --accent-ink: #8a6100;
    --p1: #2f6fed;
    --p1-soft: #e1eafe;
    --p2: #e0505a;
    --p2-soft: #fce3e5;
    --border: #cbd6ee;
    --shadow: rgba(30, 39, 97, 0.14);
    --uncolored: #b9c3dc;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10142b;
      --bg-grid: #1e2750;
      --surface: #171c3a;
      --surface-2: #1b2145;
      --ink: #e7ecff;
      --muted: #96a1c7;
      --heading: #cbd8ff;
      --accent: #f5c233;
      --accent-ink: #3a2c00;
      --p1: #6f9cff;
      --p1-soft: #233064;
      --p2: #ff7a83;
      --p2-soft: #4a1f27;
      --border: #2b335e;
      --shadow: rgba(0, 0, 0, 0.45);
      --uncolored: #3a4270;
    }
  }

  :root[data-theme="dark"] {
    --bg: #10142b;
    --bg-grid: #1e2750;
    --surface: #171c3a;
    --surface-2: #1b2145;
    --ink: #e7ecff;
    --muted: #96a1c7;
    --heading: #cbd8ff;
    --accent: #f5c233;
    --accent-ink: #3a2c00;
    --p1: #6f9cff;
    --p1-soft: #233064;
    --p2: #ff7a83;
    --p2-soft: #4a1f27;
    --border: #2b335e;
    --shadow: rgba(0, 0, 0, 0.45);
    --uncolored: #3a4270;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    background-image:
      linear-gradient(var(--bg-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
    background-size: 28px 28px;
    color: var(--ink);
    font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
    min-height: 100vh;
  }

  .display {
    font-family: "Black Han Sans", "Noto Sans KR", sans-serif;
    letter-spacing: 0.02em;
  }

  .mono {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
  }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  /* ---------- Header ---------- */
  header.top {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    margin-bottom: 26px;
  }

  .title-block h1 {
    margin: 0;
    font-size: clamp(28px, 4vw, 40px);
    color: var(--heading);
    text-wrap: balance;
  }

  .title-block p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 14px;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }

  .segmented {
    display: inline-flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }

  .segmented button {
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: "Noto Sans KR", sans-serif;
    font-weight: 700;
    font-size: 14px;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
  }

  .segmented button.active {
    background: var(--heading);
    color: #fff;
  }

  .segmented button:focus-visible,
  .iconbtn:focus-visible,
  .toggle:focus-visible,
  .primary:focus-visible,
  .edge-hit:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  .iconbtn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    font-family: "Noto Sans KR", sans-serif;
    font-weight: 700;
    font-size: 14px;
    padding: 9px 14px;
    border-radius: 12px;
    cursor: pointer;
  }

  .iconbtn:hover { border-color: var(--heading); }

  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    padding: 7px 14px 7px 8px;
    border-radius: 999px;
    cursor: pointer;
    font-weight: 700;
    font-size: 14px;
  }

  .toggle .dot {
    width: 34px;
    height: 20px;
    border-radius: 999px;
    background: var(--uncolored);
    position: relative;
    transition: background 0.15s;
    flex: none;
  }

  .toggle .dot::after {
    content: "";
    position: absolute;
    top: 2px; left: 2px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--surface);
    transition: transform 0.15s;
  }

  .toggle.on .dot { background: var(--heading); }
  .toggle.on .dot::after { transform: translateX(14px); }

  #aiDiffSeg[hidden] { display: none; }

  /* ---------- Layout ---------- */
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1.5fr) minmax(260px, 1fr);
    gap: 22px;
    align-items: start;
  }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 10px 28px var(--shadow);
  }

  /* ---------- Board ---------- */
  .board-card {
    padding: 18px;
    position: relative;
  }

  .board-frame {
    position: relative;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    aspect-ratio: 1 / 1;
  }

  .board-frame svg { width: 100%; height: 100%; display: block; }

  .board-frame svg { cursor: pointer; }

  .edge-hit {
    fill: none;
    stroke: transparent;
    stroke-width: 4;
    pointer-events: none;
  }

  .edge-line {
    fill: none;
    stroke: var(--uncolored);
    stroke-width: 3.5;
    stroke-dasharray: 7 7;
    stroke-linecap: round;
    transition: stroke 0.12s, stroke-width 0.12s, opacity 0.12s;
    pointer-events: none;
  }

  .edge-line.p1 { stroke: var(--p1); stroke-dasharray: none; stroke-width: 6; }
  .edge-line.p2 { stroke: var(--p2); stroke-dasharray: none; stroke-width: 6; }

  .edge-line.preview-p1 { stroke: var(--p1); opacity: 0.45; stroke-dasharray: none; stroke-width: 6; }
  .edge-line.preview-p2 { stroke: var(--p2); opacity: 0.45; stroke-dasharray: none; stroke-width: 6; }

  .pt-circle {
    fill: var(--surface);
    stroke: var(--ink);
    stroke-width: 3;
  }
  .pt-circle.lit { fill: var(--accent); stroke: var(--accent-ink); }

  .pt-label {
    font-family: "JetBrains Mono", monospace;
    font-weight: 700;
    font-size: 15px;
    fill: var(--ink);
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
  }

  .win-triangle {
    stroke-width: 3;
    opacity: 0;
    transform-origin: 250px 250px;
  }

  .win-triangle.show {
    opacity: 0.55;
    animation: pulse 1.1s ease-in-out 2;
  }

  @media (prefers-reduced-motion: reduce) {
    .win-triangle.show { animation: none; }
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.035); }
  }

  /* ---------- Turn banner ---------- */
  .turn-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 14px;
    padding: 10px 16px;
    border-radius: 12px;
    background: var(--surface-2);
    font-weight: 700;
    min-height: 44px;
    text-align: center;
  }

  .swatch { width: 14px; height: 14px; border-radius: 4px; flex: none; }

  /* ---------- Overlay ---------- */
  .overlay {
    position: absolute;
    inset: 18px;
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(2px);
    border-radius: 14px;
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    flex-direction: column;
    gap: 10px;
    padding: 20px;
  }

  .overlay.show { display: flex; }

  .overlay .big {
    font-family: "Black Han Sans", sans-serif;
    font-size: clamp(28px, 5vw, 40px);
  }

  .overlay p { margin: 0; color: var(--muted); max-width: 40ch; }

  .primary {
    margin-top: 6px;
    border: none;
    background: var(--heading);
    color: #fff;
    font-family: "Noto Sans KR", sans-serif;
    font-weight: 700;
    font-size: 15px;
    padding: 11px 22px;
    border-radius: 12px;
    cursor: pointer;
  }
  .primary:hover { filter: brightness(1.1); }

  /* ---------- Sidebar ---------- */
  .side { display: flex; flex-direction: column; gap: 16px; }

  .side .card { padding: 18px 20px; }

  .side h2 {
    margin: 0 0 12px;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .score-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
  }

  .score-row + .score-row { border-top: 1px dashed var(--border); }

  .name-input {
    flex: 1;
    min-width: 0;
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink);
    font-family: "Noto Sans KR", sans-serif;
    font-weight: 700;
    font-size: 15px;
    padding: 4px 6px;
    border-radius: 8px;
  }
  .name-input:hover, .name-input:focus { border-color: var(--border); outline: none; }

  .score-num {
    font-size: 22px;
    font-weight: 700;
    min-width: 2ch;
    text-align: right;
  }

  .player-dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }

  .draw-row {
    display: flex;
    justify-content: space-between;
    padding-top: 10px;
    margin-top: 4px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 13px;
  }

  .reset-scores {
    margin-top: 12px;
    width: 100%;
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--muted);
    padding: 8px;
    border-radius: 10px;
    font-family: "Noto Sans KR", sans-serif;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
  .reset-scores:hover { color: var(--ink); border-color: var(--muted); }

  details.howto summary {
    cursor: pointer;
    font-weight: 700;
    color: var(--heading);
    list-style: none;
  }
  details.howto summary::-webkit-details-marker { display: none; }
  details.howto summary::before {
    content: "▸ ";
    color: var(--accent-ink);
  }
  details.howto[open] summary::before { content: "▾ "; }

  details.howto ol {
    margin: 10px 0 0;
    padding-left: 20px;
    color: var(--ink);
    font-size: 14px;
    line-height: 1.6;
  }

  footer.credit {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 30px;
  }
</style>

<div class="wrap">
  <header class="top">
    <div class="title-block">
      <h1 class="display">심(SIM) 게임</h1>
      <p>선을 칠해서 삼각형을 피하세요 — 만들면 진다!</p>
    </div>
    <div class="controls">
      <div class="segmented" id="pointSeg" role="group" aria-label="점 개수 선택">
        <button data-n="5">점 5개</button>
        <button data-n="6" class="active">점 6개</button>
        <button data-n="7">점 7개</button>
      </div>
      <button class="iconbtn" id="undoBtn" title="한 수 무르기">↶ 되돌리기</button>
      <button class="iconbtn" id="newBtn" title="새 게임 시작">⟳ 새 게임</button>
      <button class="toggle" id="aiToggle" aria-pressed="false">
        <span class="dot"></span> 컴퓨터 대결
      </button>
      <div class="segmented" id="aiDiffSeg" role="group" aria-label="컴퓨터 난이도 선택" hidden>
        <button data-diff="easy">쉬움</button>
        <button data-diff="normal" class="active">보통</button>
      </div>
    </div>
  </header>

  <div class="layout">
    <section class="card board-card">
      <div class="board-frame" id="boardFrame">
        <svg id="board" viewBox="0 0 500 500" aria-label="심 게임 판"></svg>
        <div class="overlay" id="overlay">
          <div class="big" id="overlayTitle" style="color: var(--heading);"></div>
          <p id="overlaySub"></p>
          <button class="primary" id="overlayBtn">다시 하기</button>
        </div>
      </div>
      <div class="turn-bar" id="turnBar"></div>
    </section>

    <aside class="side">
      <div class="card">
        <h2>토너먼트 기록</h2>
        <div class="score-row">
          <span class="player-dot" style="background: var(--p1);"></span>
          <input class="name-input" id="p1Name" value="선수 1" maxlength="12" />
          <span class="score-num mono" id="p1Score">0</span>
        </div>
        <div class="score-row">
          <span class="player-dot" style="background: var(--p2);"></span>
          <input class="name-input" id="p2Name" value="선수 2" maxlength="12" />
          <span class="score-num mono" id="p2Score">0</span>
        </div>
        <div class="draw-row"><span>무승부</span><span class="mono" id="drawScore">0</span></div>
        <button class="reset-scores" id="resetScores">기록 초기화</button>
      </div>

      <div class="card">
        <details class="howto">
          <summary>게임 방법 보기</summary>
          <ol>
            <li>번갈아 가며 선을 하나씩 골라 자신의 색으로 칠해요.</li>
            <li>자신이 칠한 색으로 삼각형이 완성되면 그 사람이 져요.</li>
            <li>점이 6개 이상이면 언젠가 반드시 삼각형이 생겨요 — 점 5개일 때만 무승부가 가능해요.</li>
          </ol>
        </details>
      </div>
    </aside>
  </div>

  <footer class="credit">수학 동아리 · 램지의 정리를 몸으로 확인하는 게임</footer>
</div>

<script>
(function () {
  "use strict";

  var CENTER = 250, RADIUS = 190;
  var COLORS = { 1: "p1", 2: "p2" };

  var state = {
    n: 6,
    points: [],
    edges: [],          // [ [i,j], ... ]
    edgeColor: [],       // parallel array: 0 = uncolored, 1/2 = player
    current: 1,
    history: [],         // stack of edge indices colored, for undo
    over: false,
    vsAI: false,
    aiThinking: false,
    aiDifficulty: "normal", // "easy" | "normal"
  };

  var scores = { p1: 0, p2: 0, draws: 0, p1Name: "선수 1", p2Name: "선수 2" };

  // ---------------- persistence (best-effort, per-device convenience only) ----------------
  function loadScores() {
    try {
      var raw = localStorage.getItem("sim-game-scores-v1");
      if (raw) {
        var parsed = JSON.parse(raw);
        Object.assign(scores, parsed);
      }
    } catch (e) { /* storage unavailable — ignore, defaults stand */ }
  }
  function saveScores() {
    try { localStorage.setItem("sim-game-scores-v1", JSON.stringify(scores)); }
    catch (e) { /* ignore */ }
  }

  // ---------------- geometry ----------------
  function buildPoints(n) {
    var pts = [];
    for (var i = 0; i < n; i++) {
      var angle = (Math.PI / 2) - (2 * Math.PI * i / n);
      pts.push({ x: CENTER + RADIUS * Math.cos(angle), y: CENTER - RADIUS * Math.sin(angle) });
    }
    return pts;
  }

  function buildEdges(n) {
    var e = [];
    for (var i = 0; i < n; i++) for (var j = i + 1; j < n; j++) e.push([i, j]);
    return e;
  }

  function edgeIndex(n, edges, a, b) {
    for (var k = 0; k < edges.length; k++) {
      if ((edges[k][0] === a && edges[k][1] === b) || (edges[k][0] === b && edges[k][1] === a)) return k;
    }
    return -1;
  }

  // ---------------- game setup ----------------
  function setupGame(n) {
    state.n = n;
    state.points = buildPoints(n);
    state.edges = buildEdges(n);
    state.edgeColor = state.edges.map(function () { return 0; });
    state.current = 1;
    state.history = [];
    state.over = false;
    state.aiThinking = false;
    hideOverlay();
    renderBoard();
    renderTurn();
  }

  // ---------------- triangle check ----------------
  function findTriangleWith(edgeIdx, color, edgeColorArr) {
    var n = state.n, edges = state.edges;
    var a = edges[edgeIdx][0], b = edges[edgeIdx][1];
    for (var k = 0; k < n; k++) {
      if (k === a || k === b) continue;
      var ak = edgeIndex(n, edges, a, k);
      var bk = edgeIndex(n, edges, b, k);
      if (edgeColorArr[ak] === color && edgeColorArr[bk] === color) {
        return [a, b, k];
      }
    }
    return null;
  }

  function allColored(edgeColorArr) {
    for (var i = 0; i < edgeColorArr.length; i++) if (edgeColorArr[i] === 0) return false;
    return true;
  }

  // ---------------- moves ----------------
  function playEdge(idx) {
    if (state.over || state.edgeColor[idx] !== 0) return;
    var mover = state.current;
    state.edgeColor[idx] = mover;
    state.history.push(idx);

    var tri = findTriangleWith(idx, mover, state.edgeColor);
    renderBoard();

    if (tri) {
      finishGame(mover === 1 ? 2 : 1, mover, tri);
      return;
    }
    if (allColored(state.edgeColor)) {
      finishDraw();
      return;
    }
    state.current = mover === 1 ? 2 : 1;
    renderTurn();

    if (state.vsAI && state.current === 2 && !state.over) {
      state.aiThinking = true;
      renderTurn();
      setTimeout(aiMove, 550);
    }
  }

  function undo() {
    if (state.aiThinking || state.history.length === 0) return;
    hideOverlay();
    state.over = false;

    var idx = state.history.pop();
    var moverOfPoppedMove = state.edgeColor[idx];
    state.edgeColor[idx] = 0;

    // In AI mode, undoing the computer's move should hand control straight back
    // to the human rather than leaving the board mid-turn.
    if (state.vsAI && moverOfPoppedMove === 2 && state.history.length > 0) {
      var idx2 = state.history.pop();
      state.edgeColor[idx2] = 0;
    }

    var movesPlayed = state.history.length;
    state.current = (movesPlayed % 2 === 0) ? 1 : 2;
    renderBoard();
    renderTurn();
  }

  function finishGame(winner, loser, triangle) {
    state.over = true;
    state.aiThinking = false;
    var color = COLORS[loser];
    highlightTriangle(triangle, color);
    var winnerName = winner === 1 ? scores.p1Name : scores.p2Name;
    var loserName = loser === 1 ? scores.p1Name : scores.p2Name;
    if (winner === 1) scores.p1++; else scores.p2++;
    saveScores();
    renderScores();
    showOverlay(
      winnerName + " 승리!",
      loserName + "이(가) " + (loser === 1 ? "파란" : "빨간") + " 삼각형을 완성했어요."
    );
    renderTurn();
  }

  function finishDraw() {
    state.over = true;
    state.aiThinking = false;
    scores.draws++;
    saveScores();
    renderScores();
    showOverlay(
      "무승부!",
      "모든 선이 칠해졌지만 삼각형이 생기지 않았어요 — 점이 " + state.n + "개라서 가능했어요."
    );
    renderTurn();
  }

  // ---------------- simple heuristic AI (1-ply, not perfect play) ----------------
  function safeEdgesFor(color, edgeColorArr) {
    var safe = [];
    for (var i = 0; i < edgeColorArr.length; i++) {
      if (edgeColorArr[i] !== 0) continue;
      var trial = edgeColorArr.slice();
      trial[i] = color;
      if (!findTriangleWith(i, color, trial)) safe.push(i);
    }
    return safe;
  }

  function aiMove() {
    if (state.over) { state.aiThinking = false; return; }
    var color = 2;
    var opponent = 1;
    var mySafe = safeEdgesFor(color, state.edgeColor);
    var choice;

    if (mySafe.length === 0) {
      // No safe move exists — a loss is forced no matter what. Any edge is as good as any other.
      var remaining = [];
      for (var i = 0; i < state.edgeColor.length; i++) if (state.edgeColor[i] === 0) remaining.push(i);
      choice = remaining[Math.floor(Math.random() * remaining.length)];
    } else if (state.aiDifficulty === "easy") {
      // Easy: just avoid losing immediately — no lookahead into the opponent's reply.
      choice = mySafe[Math.floor(Math.random() * mySafe.length)];
    } else {
      // Normal: 1-ply lookahead — prefer the safe move that leaves the opponent
      // with the fewest safe replies of their own.
      var bestScore = Infinity, candidates = [];
      mySafe.forEach(function (idx) {
        var trial = state.edgeColor.slice();
        trial[idx] = color;
        var oppSafeCount = safeEdgesFor(opponent, trial).length;
        if (oppSafeCount < bestScore) { bestScore = oppSafeCount; candidates = [idx]; }
        else if (oppSafeCount === bestScore) candidates.push(idx);
      });
      choice = candidates[Math.floor(Math.random() * candidates.length)];
    }

    state.aiThinking = false;
    playEdge(choice);
  }

  // ---------------- rendering ----------------
  var svg = document.getElementById("board");

  function renderBoard() {
    var pts = state.points, edges = state.edges;
    var html = "";

    // faint background grid ring (subject motif)
    html += '<circle cx="250" cy="250" r="' + RADIUS + '" fill="none" stroke="var(--bg-grid)" stroke-width="1"></circle>';

    edges.forEach(function (e, i) {
      var a = pts[e[0]], b = pts[e[1]];
      var col = state.edgeColor[i];
      var cls = col === 1 ? "p1" : (col === 2 ? "p2" : "");
      var locked = state.over || col !== 0 || (state.vsAI && state.current === 2);
      html +=
        '<line class="edge-line ' + cls + '" data-edge-line="' + i + '" x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '"></line>' +
        '<line class="edge-hit" data-idx="' + i + '" x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '" tabindex="' + (locked ? "-1" : "0") + '" role="button" aria-label="점 ' + labelOf(e[0]) + '과 점 ' + labelOf(e[1]) + ' 잇는 선"></line>';
    });

    html += '<polygon id="winTriangle" class="win-triangle" points=""></polygon>';

    pts.forEach(function (p, i) {
      html += '<circle class="pt-circle" cx="' + p.x + '" cy="' + p.y + '" r="17"></circle>' +
        '<text class="pt-label" x="' + p.x + '" y="' + p.y + '">' + labelOf(i) + '</text>';
    });

    svg.innerHTML = html;

    svg.querySelectorAll(".edge-hit").forEach(function (el) {
      el.addEventListener("keydown", function (ev) {
        if (el.getAttribute("tabindex") === "-1") return;
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); playEdge(parseInt(el.getAttribute("data-idx"), 10)); }
      });
    });
  }

  function labelOf(i) { return String.fromCharCode(65 + i); }

  // ---------------- pointer hit-testing (nearest edge, not raw DOM stacking) ----------------
  // With up to 21 edges converging near the centre, overlapping invisible hit-boxes make
  // click targets ambiguous. Instead we find whichever edge segment is geometrically
  // closest to the pointer and act on that — reliable regardless of paint order.
  var HIT_THRESHOLD = 22;

  function screenToSvgPoint(evt) {
    var pt = svg.createSVGPoint();
    pt.x = evt.clientX;
    pt.y = evt.clientY;
    var ctm = svg.getScreenCTM();
    if (!ctm) return null;
    return pt.matrixTransform(ctm.inverse());
  }

  function distToSegment(p, a, b) {
    var dx = b.x - a.x, dy = b.y - a.y;
    var lenSq = dx * dx + dy * dy;
    var t = lenSq === 0 ? 0 : ((p.x - a.x) * dx + (p.y - a.y) * dy) / lenSq;
    t = Math.max(0, Math.min(1, t));
    var cx = a.x + t * dx, cy = a.y + t * dy;
    return Math.hypot(p.x - cx, p.y - cy);
  }

  function nearestEdge(loc) {
    var best = -1, bestDist = Infinity;
    state.edges.forEach(function (e, i) {
      var d = distToSegment(loc, state.points[e[0]], state.points[e[1]]);
      if (d < bestDist) { bestDist = d; best = i; }
    });
    return { idx: best, dist: bestDist };
  }

  function inputLocked() {
    return state.over || state.aiThinking || (state.vsAI && state.current === 2);
  }

  function clearPreview() {
    svg.querySelectorAll(".edge-line.preview-p1, .edge-line.preview-p2").forEach(function (el) {
      el.classList.remove("preview-p1", "preview-p2");
    });
  }

  svg.addEventListener("pointermove", function (ev) {
    if (inputLocked()) { clearPreview(); return; }
    var loc = screenToSvgPoint(ev);
    if (!loc) return;
    var res = nearestEdge(loc);
    clearPreview();
    if (res.dist <= HIT_THRESHOLD && state.edgeColor[res.idx] === 0) {
      var line = svg.querySelector('[data-edge-line="' + res.idx + '"]');
      if (line) line.classList.add(state.current === 1 ? "preview-p1" : "preview-p2");
    }
  });
  svg.addEventListener("pointerleave", clearPreview);

  svg.addEventListener("click", function (ev) {
    if (inputLocked()) return;
    var loc = screenToSvgPoint(ev);
    if (!loc) return;
    var res = nearestEdge(loc);
    if (res.dist <= HIT_THRESHOLD && state.edgeColor[res.idx] === 0) {
      clearPreview();
      playEdge(res.idx);
    }
  });

  function highlightTriangle(triangle, colorClass) {
    var pts = state.points;
    var poly = svg.querySelector("#winTriangle");
    if (!poly) return;
    var ptStr = triangle.map(function (idx) { return pts[idx].x + "," + pts[idx].y; }).join(" ");
    poly.setAttribute("points", ptStr);
    poly.style.fill = colorClass === "p1" ? "var(--p1-soft)" : "var(--p2-soft)";
    poly.style.stroke = colorClass === "p1" ? "var(--p1)" : "var(--p2)";
    poly.classList.add("show");
  }

  function renderTurn() {
    var bar = document.getElementById("turnBar");
    if (state.over) { bar.innerHTML = "게임이 끝났어요 — 다시 하기를 눌러보세요"; return; }
    if (state.aiThinking) { bar.innerHTML = "🤔 컴퓨터가 생각 중..."; return; }
    var name = state.current === 1 ? scores.p1Name : scores.p2Name;
    var color = state.current === 1 ? "var(--p1)" : "var(--p2)";
    bar.innerHTML = '<span class="swatch" style="background:' + color + '"></span> ' + escapeHtml(name) + '님 차례예요';
  }

  function renderScores() {
    document.getElementById("p1Score").textContent = scores.p1;
    document.getElementById("p2Score").textContent = scores.p2;
    document.getElementById("drawScore").textContent = scores.draws;
    document.getElementById("p1Name").value = scores.p1Name;
    document.getElementById("p2Name").value = scores.p2Name;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function showOverlay(title, sub) {
    document.getElementById("overlayTitle").textContent = title;
    document.getElementById("overlaySub").textContent = sub;
    document.getElementById("overlay").classList.add("show");
  }
  function hideOverlay() {
    document.getElementById("overlay").classList.remove("show");
    var poly = svg.querySelector("#winTriangle");
    if (poly) poly.classList.remove("show");
  }

  // ---------------- wiring ----------------
  document.getElementById("pointSeg").addEventListener("click", function (ev) {
    var btn = ev.target.closest("button[data-n]");
    if (!btn) return;
    document.querySelectorAll("#pointSeg button").forEach(function (b) { b.classList.remove("active"); });
    btn.classList.add("active");
    setupGame(parseInt(btn.getAttribute("data-n"), 10));
  });

  document.getElementById("undoBtn").addEventListener("click", undo);
  document.getElementById("newBtn").addEventListener("click", function () { setupGame(state.n); });

  var aiToggle = document.getElementById("aiToggle");
  var aiDiffSeg = document.getElementById("aiDiffSeg");
  aiToggle.addEventListener("click", function () {
    state.vsAI = !state.vsAI;
    aiToggle.classList.toggle("on", state.vsAI);
    aiToggle.setAttribute("aria-pressed", String(state.vsAI));
    aiDiffSeg.hidden = !state.vsAI;
    setupGame(state.n);
  });

  aiDiffSeg.addEventListener("click", function (ev) {
    var btn = ev.target.closest("button[data-diff]");
    if (!btn) return;
    aiDiffSeg.querySelectorAll("button").forEach(function (b) { b.classList.remove("active"); });
    btn.classList.add("active");
    state.aiDifficulty = btn.getAttribute("data-diff");
  });

  document.getElementById("overlayBtn").addEventListener("click", function () { setupGame(state.n); });

  document.getElementById("p1Name").addEventListener("input", function (e) {
    scores.p1Name = e.target.value || "선수 1"; saveScores(); renderTurn();
  });
  document.getElementById("p2Name").addEventListener("input", function (e) {
    scores.p2Name = e.target.value || "선수 2"; saveScores(); renderTurn();
  });
  document.getElementById("resetScores").addEventListener("click", function () {
    scores.p1 = 0; scores.p2 = 0; scores.draws = 0;
    saveScores(); renderScores();
  });

  // ---------------- init ----------------
  loadScores();
  renderScores();
  setupGame(6);
})();
</script>
